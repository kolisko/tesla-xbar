name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-15-intel
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Swift analysis toolchain
        if: matrix.language == 'swift'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Keychain helper for analysis
        if: matrix.language == 'swift'
        timeout-minutes: 10
        run: |
          mkdir -p build
          python3 - <<'PY'
          import pathlib, subprocess, sys
          build = subprocess.Popen(["swiftc", "keychain.swift", "-o", "build/tesla-keychain"])
          try:
              sys.exit(build.wait(timeout=150))
          except subprocess.TimeoutExpired:
              subprocess.run(["ps", "-axo", "pid,ppid,pcpu,etime,comm"], check=True)
              pids = subprocess.run(["pgrep", "-x", "extractor.real"], capture_output=True, text=True).stdout.split()
              for pid in pids:
                  report = pathlib.Path("build") / ("sample-" + pid + ".txt")
                  subprocess.run(["sample", pid, "3", "-file", str(report)], timeout=30)
                  if report.exists():
                      print(report.read_text()[:24000], flush=True)
              sys.exit(build.wait(timeout=240))
          PY
      - name: Show Swift extraction diagnostics on failure
        if: failure() && matrix.language == 'swift'
        run: |
          if [ -d "$CODEQL_EXTRACTOR_SWIFT_LOG_DIR" ]; then
            find "$CODEQL_EXTRACTOR_SWIFT_LOG_DIR" -type f -name '*.log' -exec tail -n 40 {} \;
          fi
          if [ -f "$CODEQL_TRACER_LOG" ]; then
            tail -n 80 "$CODEQL_TRACER_LOG"
          fi
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
